<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0f110f; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; color: #ede9df; }
    a { color: #e8763a; } a:hover { color: #f19a68; }
    .px { font-family: "Pixelify Sans", "IBM Plex Mono", monospace; }
    .panel { background: rgba(16, 19, 17, 0.88); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
    .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); color: #cfd2c6; font-family: "Pixelify Sans", monospace; font-size: 14px; }
    .stat { font-family: "Pixelify Sans", monospace; font-variant-numeric: tabular-nums; }
    .slot { width: 64px; height: 64px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; position: relative; }
    .slot.sel { border-color: #e8763a; box-shadow: 0 0 0 2px rgba(232,118,58,0.35), inset 0 0 18px rgba(232,118,58,0.15); }
    .slot .qty { position: absolute; right: 4px; bottom: 2px; font-family: "Pixelify Sans", monospace; font-size: 16px; font-weight: 700; color: #ede9df; text-shadow: 0 1px 0 #000; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(127,184,164,0.14); color: #7fb8a4; font-weight: 600; font-size: 13px; border: 1px solid rgba(127,184,164,0.35); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 6px; font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
    .btn.primary { background: #e8763a; color: #1b0f08; }
    .btn.ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #ede9df; }
    .btn.disabled { background: rgba(255,255,255,0.04); color: #6f756c; border: 1px solid rgba(255,255,255,0.06); }
    .eyebrow { font-family: "Pixelify Sans", monospace; font-size: 14px; letter-spacing: 0.10em; text-transform: uppercase; color: #e8763a; }
    .muted { color: #a8aa9c; }
    .hearts { display: flex; gap: 4px; }
  </style>
</helmet>
<div style="position:relative; width:1280px; height:720px; overflow:hidden; background:#0f110f;">

  <img src="room.png" alt="" style="position:absolute; inset:0; width:1280px; height:720px; image-rendering: pixelated; filter: blur(3px);"><div style="position:absolute; inset:0; background:rgba(8,10,8,0.55);"></div>
  <!-- left: character card -->
  <div class="panel" style="position:absolute; left:120px; top:90px; width:300px; border-radius:10px; padding:20px; display:flex; flex-direction:column; gap:16px;">
    <div style="display:flex; gap:14px; align-items:center;">
      <div style="width:72px; height:72px; border-radius:8px; overflow:hidden; background:#3c4a55; flex-shrink:0;"><img src="hero_portrait.png" alt="" style="width:72px; height:72px; image-rendering: pixelated;"></div>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <span class="px" style="font-size:22px;">Warden</span>
        <span class="muted" style="font-size:13px;">Emberfall · Day 3</span>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted" style="font-size:13px;">Health</span><div class="hearts"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="none" stroke="#1a0c0a" stroke-width="2" stroke-linejoin="round"/><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="#e0483f"/></svg><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="none" stroke="#1a0c0a" stroke-width="2" stroke-linejoin="round"/><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="#e0483f"/></svg><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="none" stroke="#1a0c0a" stroke-width="2" stroke-linejoin="round"/><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="#e0483f"/></svg><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="none" stroke="#1a0c0a" stroke-width="2" stroke-linejoin="round"/><path d="M12 21 3 12.5V6l3-3h3l3 3 3-3h3l3 3v6.5z" fill="#3b3f3b"/><path d="M12 21 3 12.5V6l3-3h3l3 3v15z" fill="#e0483f"/></svg></div></div>
      <div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted" style="font-size:13px;">Sword</span><span style="display:inline-flex; align-items:center; gap:6px; font-size:14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5 20 3l-1.5 5.5L8 19l-3-3z"/><path d="M5 16l-2 2M8 19l-2 2M12 12l3 3"/></svg> Iron · <span class="stat">2</span> dmg</span></div>
      <div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted" style="font-size:13px;">Armor</span><span style="display:inline-flex; align-items:center; gap:6px; font-size:14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg> Leather</span></div>
      <div style="display:flex; justify-content:space-between; align-items:center;"><span class="muted" style="font-size:13px;">Shards</span><span style="display:inline-flex; align-items:center; gap:6px; font-size:14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8763a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l5 8-5 12-5-12z"/><path d="M7 10h10"/></svg> <span class="stat">1</span> / 3</span></div>
    </div>
  </div>
  <!-- right: inventory panel (slid in) -->
  <div class="panel" style="position:absolute; right:0; top:0; bottom:0; width:520px; border-radius:0; border-right:0; padding:28px 32px; display:flex; flex-direction:column; gap:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="px" style="font-size:26px;">Inventory</span>
      <div style="display:flex; align-items:center; gap:8px;"><span class="kbd">Tab</span><span class="muted" style="font-size:13px;">close</span></div>
    </div>
    <div style="display:flex; gap:6px;">
      <div style="padding:6px 12px; border-radius:6px; background:rgba(232,118,58,0.16); color:#e8763a; font-weight:600; font-size:14px;">Items</div>
      <div class="muted" style="padding:6px 12px; border-radius:6px; font-size:14px;">Tools</div>
      <div class="muted" style="padding:6px 12px; border-radius:6px; font-size:14px;">Equipment</div>
    </div>
    <div style="display:grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap:10px;"><div class="slot sel"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ede9df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c5-1 10 1 13 5 1 2 2 5 2 8-3-1-6-3-8-6C9 11 6 9 4 6z"/></svg></div><div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4M11 3v4.5L6.5 14a4.5 4.5 0 0 0 4 6.5h3a4.5 4.5 0 0 0 4-6.5L13 7.5V3"/><path d="M8 15h8" /></svg><span class="qty">2</span></div><div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="14" r="6.5"/><path d="M14.5 9.5 17 7M17 7l1.5-1.5M18.5 4.5l1 1"/></svg><span class="qty">3</span></div><div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3M15 12v2"/></svg><span class="qty">1</span></div><div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e8763a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l5 8-5 12-5-12z"/><path d="M7 10h10"/></svg><span class="qty">1</span></div><div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cfd2c6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
    <!-- selected item detail -->
    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:18px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="slot" style="width:48px; height:48px;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ede9df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c5-1 10 1 13 5 1 2 2 5 2 8-3-1-6-3-8-6C9 11 6 9 4 6z"/></svg></div>
        <div style="display:flex; flex-direction:column; gap:2px;">
          <span style="font-weight:600; font-size:17px;">Boomerang</span>
          <span class="eyebrow">Dungeon tool · Whisperwood Hollow</span>
        </div>
      </div>
      <p style="margin:0; font-size:14.5px; line-height:1.5; color:#cfd2c6;">Stuns enemies on hit and fetches distant items. Returns to you on its own.</p>
      <div style="display:flex; gap:10px; margin-top:4px;">
        <div class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7fb8a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c5-1 10 1 13 5 1 2 2 5 2 8-3-1-6-3-8-6C9 11 6 9 4 6z"/></svg> Equipped · <span class="kbd" style="height:18px; min-width:18px; font-size:13px;">L</span></div>
        <div class="btn ghost" style="height:38px; font-size:14px;">Unequip</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
